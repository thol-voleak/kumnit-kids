<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="#FFFFFF" opacity="0.15" />
  
  <!-- Central Mascot & Character -->
  <g filter="url(#shadow)" text-anchor="middle" dominant-baseline="central">
    <!-- Traditional Khmer Krama Scarf Pattern accent -->
    <rect x="156" y="380" width="200" height="24" rx="8" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Big Friendly Mascot Emoji -->
    <text x="256" y="220" font-size="160" font-family="sans-serif">🐒</text>
    
    <!-- Khmer Ka Glyph & English A -->
    <text x="140" y="340" font-size="70" font-weight="900" fill="#FFFFFF" font-family="'Kantumruy Pro', sans-serif">ក</text>
    <text x="372" y="340" font-size="70" font-weight="900" fill="#FEF08A" font-family="'Fredoka', sans-serif">A</text>
    <text x="256" y="440" font-size="34" font-weight="900" fill="#FFFFFF" font-family="'Fredoka', sans-serif" letter-spacing="2">KUMNIT KIDS</text>
  </g>
</svg>
